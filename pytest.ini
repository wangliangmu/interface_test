[pytest]
addopts = -v --tb=short
testpaths = ["tests"]
pythonpath = .
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(message)s

markers =
    smoke: 冒烟测试
    clone: 克隆相关测试
    ai: AI功能测试
    dialog: 对话创建测试
    login: 登录测试
    risk: 风控测试

# 并行测试配置
addopts += -n auto --dist=loadscope
