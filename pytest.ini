[pytest]
addopts = -v --tb=short -n auto --dist=loadscope
testpaths = ["tests"]
pythonpath = .
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

markers =
    smoke: 冒烟测试
    clone: 克隆相关测试
    ai: AI功能测试
    dialog: 对话创建测试
    login: 登录测试
    risk: 风控测试
    independent_steps: 步骤独立执行，前序步骤失败不跳过后续步骤
